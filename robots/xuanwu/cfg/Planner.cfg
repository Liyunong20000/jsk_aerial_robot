#!/usr/bin/env python
PACKAGE = "xuanwu"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

# ==============================================================================
#       Name             Type      Level  Description                        Default  Min    Max
# ==============================================================================

# --- System Loop Settings ---
gen.add("control_rate",    double_t, 0, "MPC Control Rate (Hz)",             20.0,    10.0,  100.0)
gen.add("horizon",         int_t,    0, "Prediction Horizon (N)",            20,      5,     60)

# ==============================================================================
# Cost Weights (Q Matrices)
# ==============================================================================

# --- Position ---
group_pos = gen.add_group("Weights Position")
group_pos.add("Q_pos_x", double_t, 0, "Penalty Pos X", 100.0, 0.0, 10000.0)
group_pos.add("Q_pos_y", double_t, 0, "Penalty Pos Y", 100.0, 0.0, 10000.0)
group_pos.add("Q_pos_z", double_t, 0, "Penalty Pos Z", 100.0, 0.0, 10000.0)

# --- Attitude ---
group_att = gen.add_group("Weights Attitude")
group_att.add("Q_att_r", double_t, 0, "Penalty Roll",  100.0, 0.0, 10000.0)
group_att.add("Q_att_p", double_t, 0, "Penalty Pitch", 100.0, 0.0, 10000.0)
group_att.add("Q_att_y", double_t, 0, "Penalty Yaw",   100.0, 0.0, 10000.0)

# --- Velocity ---
group_vel = gen.add_group("Weights Velocity")
group_vel.add("Q_vel_x", double_t, 0, "Penalty Vel X", 10.0, 0.0, 1000.0)
group_vel.add("Q_vel_y", double_t, 0, "Penalty Vel Y", 10.0, 0.0, 1000.0)
group_vel.add("Q_vel_z", double_t, 0, "Penalty Vel Z", 10.0, 0.0, 1000.0)

# --- Angular Velocity & Integrator ---
group_misc = gen.add_group("Weights Misc")
group_misc.add("Q_omega",      double_t, 0, "Penalty Angular Rate (Damping)", 1.0,     0.0, 1000.0)
group_misc.add("Q_integrator", double_t, 0, "Penalty Integrator (Anti-Windup)", 0.00001, 0.0, 1.0) 
# Nota: Q_integrator baixo = Integrador forte (pode oscilar). Alto = Integrador fraco (mais estável, menos erro zero).

# ==============================================================================
# Input Weights (R Matrix)
# ==============================================================================
group_input = gen.add_group("Weights Input")
group_input.add("R_thrust", double_t, 0, "Penalty Thrust Input (Smoothness)", 0.001, 0.0, 100.0)

# ==============================================================================
# Offsets & Compensations
# ==============================================================================
group_offsets = gen.add_group("Offsets and Delays")

# TODO 1: Compensação de tempo na interpolação (antigo 0.5)
group_offsets.add("traj_lookahead_time", double_t, 0, "Trajectory Lookahead/Delay Comp (s)", 0.5, 0.0, 2.0)

# TODO 2: Offset Z da Tag para o Pouso (antigo 0.15)
group_offsets.add("landing_tag_offset_z", double_t, 0, "Landing Tag Z Offset (m)", 0.15, -1.0, 1.0)

exit(gen.generate(PACKAGE, "xuanwu", "Planner"))
